<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Resume Builder</h1>

        <div class="form-section">
            <h2>Personal Information</h2>

            <input type="text" id="name" placeholder="Full Name">
            <input type="email" id="email" placeholder="Email">
            <input type="text" id="phone" placeholder="Phone Number">
            <input type="text" id="address" placeholder="Address">

            <h2>Education</h2>
            <textarea id="education" placeholder="Enter your education details"></textarea>

            <h2>Skills</h2>
            <textarea id="skills" placeholder="Enter your skills"></textarea>

            <h2>Projects</h2>
            <textarea id="projects" placeholder="Enter your projects"></textarea>

            <h2>Experience</h2>
            <textarea id="experience" placeholder="Enter your experience"></textarea>

            <h2> </h2>

            <button onclick="generateResume()">Generate Resume</button>
        </div>

        <div id="resume" class="resume">
            <h1 id="rName">Your Name</h1>
            <p id="rContact">Email | Phone | Address</p>

            <hr>

            <h2>Education</h2>
            <p id="rEducation">Your education details</p>

            <h2>Skills</h2>
            <p id="rSkills">Your skills</p>

            <h2>Projects</h2>
            <p id="rProjects">Your projects</p>

            <h2>Experience</h2>
            <p id="rExperience">Your experience</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
